<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>No record at this address · Datum</title>
<style>
@font-face{font-family:'Instrument Serif';src:url('/fonts/InstrumentSerif-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('/fonts/IBMPlexMono-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
:root{--paper:#E8E6E1;--ink:#121212;--muted:rgba(18,18,18,.62);--accent:#E63E21;--line:rgba(18,18,18,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex}
.shell{width:min(1080px,100% - 48px);margin:0 auto;display:flex;flex-direction:column;flex:1;padding:28px 0 24px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-size:.8rem;letter-spacing:.2em}
.brand span{color:var(--muted)}
.meta{font-size:.66rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:56px 0}
.code{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(5.5rem,22vw,13rem);line-height:.78;letter-spacing:-.05em;color:var(--accent)}
.kicker{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.02;letter-spacing:-.02em;margin:0;max-width:18ch}
h1 em{font-style:italic;color:var(--accent)}
p{margin:0;max-width:56ch;font-size:.9rem;line-height:1.8;color:var(--muted)}
a.back{display:inline-flex;align-items:center;gap:10px;width:max-content;margin-top:6px;padding:12px 18px;border:1px solid var(--ink);border-radius:9999px;color:var(--ink);text-decoration:none;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;transition:background .2s ease,color .2s ease}
a.back:hover,a.back:focus-visible{background:var(--ink);color:var(--paper)}
footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:14px;font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
@media (max-width:560px){.shell{width:min(1080px,100% - 32px)}header,footer{flex-direction:column;gap:8px}main{padding:40px 0}}
</style>
</head>
<body>
<div class="shell">
  <header><div class="brand">DATUM <span>ATELIER</span></div><div class="meta">datumatelier.uk</div></header>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <div class="kicker">No record at this address</div>
    <h1>The page you followed <em>was never kept.</em></h1>
    <p>It may have moved, or it may never have existed. The car’s story continues on the main site.</p>
    <a class="back" href="/">← Return to Datum</a>
  </main>
  <footer><span>Independent project in development</span><span>Every car has a story</span></footer>
</div>
</body>
</html>
